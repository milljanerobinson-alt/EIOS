# EWO-034R.2 — GitHub Actions Verification Workflow for Governed EWO Branches
#
# This workflow is triggered by the EIOS pipeline when a governed EWO branch
# has committed changes. It runs:
#   - dependency installation using locked dependencies
#   - project type-check
#   - production build
#   - unit tests
#   - integration tests
#   - linting
#
# The workflow only runs on branches starting with "ewo/" to ensure it does
# not interfere with normal branch workflows.

name: EWO Verification

on:
  workflow_dispatch:
    inputs:
      ewo_ref:
        description: 'The EWO reference (e.g. EWO-034)'
        required: true
        type: string
  push:
    branches:
      - 'ewo/**'

permissions:
  contents: read
  checks: read
  actions: read

env:
  NODE_VERSION: '20'

jobs:
  verify:
    name: EWO Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout EWO branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (locked)
        run: npm ci

      - name: Type-check
        id: typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        id: lint
        run: npx eslint src/ --max-warnings 0
        continue-on-error: true

      - name: Production build
        id: build
        run: npm run build
        continue-on-error: true

      - name: Unit tests
        id: unit-tests
        run: npx vitest run --reporter=json --outputFile=test-results.json
        continue-on-error: true

      - name: Aggregate results
        if: always()
        run: |
          echo "## EWO Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Type-check | ${{ steps.typecheck.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ steps.lint.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ steps.build.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit tests | ${{ steps.unit-tests.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "EWO Ref: ${{ github.event.inputs.ewo_ref || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any gate failed
        if: always()
        run: |
          if [ "${{ steps.typecheck.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ] || \
             [ "${{ steps.unit-tests.outcome }}" != "success" ]; then
            echo "One or more verification gates failed"
            exit 1
          fi
